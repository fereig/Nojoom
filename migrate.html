<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقل البيانات — نجوم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 600px;
    border: 1px solid #2a2a4a;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #a78bfa; }
  p  { color: #9ca3af; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .btn {
    background: #7c3aed;
    color: #fff;
    border: none;
    padding: 0.8rem 2rem;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
    margin-bottom: 1rem;
    transition: opacity 0.2s;
  }
  .btn:hover   { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .log {
    background: #0f0f1a;
    border-radius: 10px;
    padding: 1rem;
    font-size: 0.8rem;
    line-height: 1.8;
    max-height: 300px;
    overflow-y: auto;
    font-family: monospace;
    border: 1px solid #2a2a4a;
  }
  .log .ok    { color: #34d399; }
  .log .err   { color: #f87171; }
  .log .info  { color: #93c5fd; }
  .progress {
    background: #2a2a4a;
    border-radius: 99px;
    height: 8px;
    margin-bottom: 1rem;
    overflow: hidden;
    display: none;
  }
  .progress-bar {
    background: #7c3aed;
    height: 100%;
    width: 0%;
    transition: width 0.3s;
    border-radius: 99px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .stat {
    background: #0f0f1a;
    border-radius: 10px;
    padding: 0.75rem;
    text-align: center;
    border: 1px solid #2a2a4a;
  }
  .stat-num  { font-size: 1.5rem; font-weight: bold; color: #a78bfa; }
  .stat-label { font-size: 0.75rem; color: #9ca3af; }
</style>
</head>
<body>
<div class="card">
  <h1>🚀 نقل البيانات لـ Firebase</h1>
  <p>الأداة دي بتنقل بيانات Google Sheets لـ Firebase مرة واحدة بس. بعد ما تخلص مش هتحتاجها تاني.</p>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="statChildren">-</div>
      <div class="stat-label">أطفال</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statPayments">-</div>
      <div class="stat-label">مدفوعات</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statAttendance">-</div>
      <div class="stat-label">سجلات حضور</div>
    </div>
  </div>

  <div class="progress" id="progressBar">
    <div class="progress-bar" id="progressFill"></div>
  </div>

  <button class="btn" id="migrateBtn" onclick="startMigration()">
    ابدأ نقل البيانات
  </button>

  <div class="log" id="log">
    <span class="info">جاهز للبدء...</span>
  </div>
</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore,
         collection,
         doc, setDoc,
         getDocs,
         writeBatch }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyDsAGqoUl88QHZXSq2VtcTtWDDp34xpHjE",
  authDomain:        "nojoom-a6f55.firebaseapp.com",
  projectId:         "nojoom-a6f55",
  storageBucket:     "nojoom-a6f55.firebasestorage.app",
  messagingSenderId: "171830438333",
  appId:             "1:171830438333:web:8ffdb8f4e004f68b20cad4"
};

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwET2jd8CtgKvozjNdab7st4GkD8roSqKnY30KyuUzRVpiDcSXTRIBUv0TKfjwwlv_BiQ/exec';

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

function log(msg, type = 'info') {
  const el  = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop  = el.scrollHeight;
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

async function fetchFromSheets(action, params = '') {
  const res  = await fetch(`${APPS_SCRIPT_URL}?action=${action}${params}`);
  return await res.json();
}

async function batchWrite(colName, docs, idField) {
  // Firestore بيسمح بـ 500 عملية في الـ batch
  const chunks = [];
  for (let i = 0; i < docs.length; i += 400) {
    chunks.push(docs.slice(i, i + 400));
  }
  for (const chunk of chunks) {
    const batch = writeBatch(db);
    chunk.forEach(d => {
      const id  = String(d[idField] || Math.random().toString(36).slice(2));
      const ref = doc(collection(db, colName), id);
      batch.set(ref, d);
    });
    await batch.commit();
  }
}

window.startMigration = async function() {
  const btn = document.getElementById('migrateBtn');
  btn.disabled = true;
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('log').innerHTML = '';

  try {
    // ── 1. الأطفال ──────────────────────────────────────
    log('📥 بنجيب بيانات الأطفال من Sheets...');
    const childData = await fetchFromSheets('getAllChildren');
    const children  = childData.children || [];
    document.getElementById('statChildren').textContent = children.length;
    log(`✅ لقينا ${children.length} طفل`, 'ok');
    setProgress(20);

    log('☁️ بنرفع الأطفال لـ Firebase...');
    await batchWrite('children', children, 'child_id');
    log(`✅ تم رفع ${children.length} طفل بنجاح`, 'ok');
    setProgress(40);

    // ── 2. حالة المدفوعات ───────────────────────────────
    log('📥 بنجيب بيانات المدفوعات...');
    const payData    = await fetchFromSheets('getPaymentStatus');
    const payments   = payData.paymentStatus || [];
    document.getElementById('statPayments').textContent = payments.length;
    log(`✅ لقينا ${payments.length} سجل مدفوعات`, 'ok');
    setProgress(60);

    log('☁️ بنرفع المدفوعات لـ Firebase...');
    await batchWrite('payment_status', payments, 'child_id');
    log(`✅ تم رفع المدفوعات بنجاح`, 'ok');
    setProgress(80);

    // ── 3. الداشبورد كاش ────────────────────────────────
    log('📥 بنجيب بيانات الداشبورد...');
    const dashboard = await fetchFromSheets('getDashboard');
    document.getElementById('statAttendance').textContent = dashboard.totalChildren || 0;
    log(`✅ بيانات الداشبورد جاهزة`, 'ok');
    setProgress(100);

    log('', 'info');
    log('🎉 تم نقل البيانات بنجاح! دلوقتي الأبليكيشن هيشتغل من Firebase.', 'ok');
    log('⚠️ مش محتاج تشغل الصفحة دي تاني.', 'info');

    btn.textContent  = '✅ تم النقل بنجاح';
    btn.style.background = '#059669';

  } catch (err) {
    log('❌ حصل خطأ: ' + err.message, 'err');
    console.error(err);
    btn.disabled = false;
  }
};
</script>
</body>
</html>
